[project]
name = "trade-simulator"
version = "0.1.0"
description = "Local paper-trading simulator driven by AI agents"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai-agents[litellm]>=0.22.3",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trade-sim = "trade_simulator.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: calls real external APIs; opt in with -m integration"]
